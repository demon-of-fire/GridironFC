name: Build iOS App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit release version (e.g. 1.2.0). Leave blank to auto-increment."
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build & Package GridironFC
    runs-on: macos-14

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine Release Version
        id: version
        run: |
          # Explicit override: workflow_dispatch input, or a commit message marker
          # like "[release 1.4.0]". Otherwise bump the minor of the highest v* tag
          # (e.g. v0.3.0 -> v0.4.0).
          EXPLICIT="${{ github.event.inputs.version }}"
          if [ -z "$EXPLICIT" ]; then
            EXPLICIT=$(git log -1 --pretty=%B | grep -oE '\[release [0-9]+\.[0-9]+\.[0-9]+\]' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
          fi
          if [ -n "$EXPLICIT" ]; then
            NEXT="$EXPLICIT"
          else
            LATEST=$(git tag -l 'v*' | sed 's/^v//' | sort -V | tail -1)
            if [ -z "$LATEST" ]; then
              NEXT="0.1.0"
            else
              MAJOR=$(echo "$LATEST" | cut -d. -f1)
              MINOR=$(echo "$LATEST" | cut -d. -f2)
              NEXT="$MAJOR.$((MINOR + 1)).0"
            fi
          fi
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Releasing version: $NEXT (previous highest tag: ${LATEST:-none})"

      - name: Sync MARKETING_VERSION in project.yml
        run: |
          PROJ=$( [ -f "project.yml" ] && echo "project.yml" || echo "GridironFC/project.yml" )
          echo "Patching $PROJ to ${{ steps.version.outputs.version }}"
          sed -i.bak -E 's/(MARKETING_VERSION:[[:space:]]*)"?[0-9]+\.[0-9]+\.[0-9]+"?/\1"${{ steps.version.outputs.version }}"/' "$PROJ" || true
          grep -n "MARKETING_VERSION" "$PROJ" || true

      - name: Select Xcode (latest available)
        run: |
          # Default Xcode on macos-14 is typically 15.x, but newer XcodeGen emits
          # a newer project objectVersion than Xcode 15 can open. Prefer the
          # newest Xcode present on the runner so the generated project opens.
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST" ]; then
            sudo xcode-select -s "$LATEST"
          fi
          xcodebuild -version
          xcode-select -p
          ls -d /Applications/Xcode*.app 2>/dev/null || true

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Locate Project Spec
        id: locate
        run: |
          if [ -f "project.yml" ]; then
            echo "projdir=." >> "$GITHUB_OUTPUT"
          elif [ -f "GridironFC/project.yml" ]; then
            echo "projdir=GridironFC" >> "$GITHUB_OUTPUT"
          else
            echo "Could not find project.yml" >&2
            exit 1
          fi
          echo "Using project directory: $(tail -1 "$GITHUB_OUTPUT")"

      - name: Generate Xcode Project
        working-directory: ${{ steps.locate.outputs.projdir }}
        run: |
          xcodegen generate
          ls -la
          grep -m1 objectVersion GridironFC.xcodeproj/project.pbxproj || true

      - name: (Optional) Install Apple Developer Certificates & Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -n "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "Installing Apple Signing Certificates..."
            CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
            PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
            KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

            echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
            echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

            security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
            security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

            security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
            security list-keychain -d user -s $KEYCHAIN_PATH

            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/
          else
            echo "No signing secrets detected. Proceeding with unsigned build."
          fi

      - name: Build and Archive
        working-directory: ${{ steps.locate.outputs.projdir }}
        run: |
          xcodebuild archive \
            -project GridironFC.xcodeproj \
            -scheme GridironFC \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/GridironFC.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Payload to .ipa
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$RUNNER_TEMP/GridironFC.xcarchive/Products/Applications/GridironFC.app" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -r GridironFC.ipa Payload
          mkdir -p "$GITHUB_WORKSPACE/build-output"
          mv GridironFC.ipa "$GITHUB_WORKSPACE/build-output/"
          ls -la "$GITHUB_WORKSPACE/build-output/"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GridironFC-iOS-IPA
          path: build-output/GridironFC.ipa
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download IPA Artifact
        uses: actions/download-artifact@v4
        with:
          name: GridironFC-iOS-IPA
          path: build-output

      - name: Determine Release Version
        id: version
        run: |
          EXPLICIT="${{ github.event.inputs.version }}"
          if [ -z "$EXPLICIT" ]; then
            EXPLICIT=$(git log -1 --pretty=%B | grep -oE '\[release [0-9]+\.[0-9]+\.[0-9]+\]' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
          fi
          if [ -n "$EXPLICIT" ]; then
            NEXT="$EXPLICIT"
          else
            LATEST=$(git tag -l 'v*' | sed 's/^v//' | sort -V | tail -1)
            if [ -z "$LATEST" ]; then
              NEXT="0.1.0"
            else
              MAJOR=$(echo "$LATEST" | cut -d. -f1)
              MINOR=$(echo "$LATEST" | cut -d. -f2)
              NEXT="$MAJOR.$((MINOR + 1)).0"
            fi
          fi
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Publishing release: v$NEXT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v$VERSION"
          TITLE="GridironFC $TAG"
          NOTES_FILE="$RUNNER_TEMP/notes.md"
          {
            echo "Automated build from \`${GITHUB_SHA::7}\` on $(date -u +'%Y-%m-%d')."
            echo ""
            echo "### Install"
            echo "1. Download \`GridironFC.ipa\` below."
            echo "2. Sideload with [Feather](https://github.com/khcrysalis/Feather) (unsigned IPA)."
            echo ""
            echo "### Commit"
            echo "$(git log -1 --pretty=%s)"
          } > "$NOTES_FILE"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading asset."
            gh release upload "$TAG" "build-output/GridironFC.ipa" --clobber
          else
            gh release create "$TAG" \
              --title "$TITLE" \
              --notes-file "$NOTES_FILE" \
              "build-output/GridironFC.ipa"
          fi
